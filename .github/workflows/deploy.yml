name: Deploy Portfolio

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy-website:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync website to S3
        run: |
          aws s3 sync website/ s3://${{ vars.S3_BUCKET_NAME }}/website/ \
            --delete \
            --cache-control "max-age=3600"

      - name: Refresh EC2 instances
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ vars.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":60}'

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "1. Website files synced to S3: \`${{ vars.S3_BUCKET_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Instance refresh triggered on ASG: \`${{ vars.ASG_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "3. New EC2 instance will boot, pull latest files from S3, and become live (~2-3 min)" >> $GITHUB_STEP_SUMMARY
